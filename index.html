<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Dois Toques</title>
  <meta name="description" content="Um golem de pedra atravessando o lago da floresta com só dois toques: esquerda e direita.">
  <meta name="theme-color" content="#16505e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dois Toques">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/version.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="game" tabindex="0" aria-label="Área do jogo. Toque na metade esquerda para pular à frente e à esquerda, na metade direita para pular à frente e à direita."></canvas>

    <div class="hud" id="hud" hidden>
      <button class="chip-btn" id="btnPause" type="button" aria-label="Pausar">❚❚</button>
      <div class="score"><b id="score">0</b><small id="bestHud">recorde 0</small></div>
      <span class="chip" id="gems">0</span>
    </div>

    <div class="overlay" id="menu">
      <div class="card">
        <p class="eyebrow" id="verLabel">Protótipo</p>
        <h1>Dois Toques</h1>
        <p class="lead" id="menuBest">Toque à esquerda ou à direita para pular.</p>
        <button class="btn primary" id="btnPlay" type="button">Jogar</button>
        <div class="group">
          <p class="hint">Visão (teste):</p>
          <div class="seg">
            <button class="seg-btn" type="button" data-view="golem">Golem · floresta</button>
            <button class="seg-btn" type="button" data-view="sapo">Sapo · de cima</button>
          </div>
        </div>
        <div class="group">
          <p class="hint">Forma da grade (teste):</p>
          <div class="seg">
            <button class="seg-btn" type="button" data-shape="losango">Losango</button>
            <button class="seg-btn" type="button" data-shape="hexagono">Hexágono</button>
          </div>
        </div>
        <div class="group">
          <p class="hint">Pulo para o lado (teste):</p>
          <div class="seg seg3">
            <button class="seg-btn" type="button" data-side="off">Desligado</button>
            <button class="seg-btn" type="button" data-side="double">Toque duplo</button>
            <button class="seg-btn" type="button" data-side="hold">Segurar</button>
          </div>
        </div>
        <div class="row2">
          <button class="btn small" id="btnSound" type="button">Som: ligado</button>
          <a class="btn small" href="privacidade.html">Privacidade</a>
        </div>
      </div>
    </div>

    <div class="overlay" id="paused" hidden>
      <div class="card">
        <h2>Pausado</h2>
        <button class="btn primary" id="btnResume" type="button">Continuar</button>
        <button class="btn" id="btnQuit" type="button">Sair para o menu</button>
      </div>
    </div>

    <div class="overlay" id="over" hidden>
      <div class="card">
        <p class="eyebrow" id="overCause"></p>
        <p class="big" id="overScore">0</p>
        <p class="lead"><span id="overBest"></span> <span id="overGems"></span></p>
        <button class="btn primary" id="btnAgain" type="button">Jogar de novo</button>
        <button class="btn" id="btnMenu" type="button">Menu</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
